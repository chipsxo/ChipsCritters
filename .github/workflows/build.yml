name: Build PUBLIC
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build PUBLIC and source
        run: bash ./gradlew regressionTest jar sourcesJar --no-daemon --no-configuration-cache
      # Release assets are prepared locally. This workflow does not upload JARs or publish releases.
